name: Tạo PDF và đăng trang

on:
  schedule:
    - cron: "0 23,4,9,14 * * *"   # 06:00 · 11:00 · 16:00 · 21:00 giờ Việt Nam (UTC+7)
  workflow_dispatch:               # bấm "Run workflow" để tạo PDF ngay
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Kiểm thử
        run: node --test tests/make-pdf.test.mjs
      - name: Chuẩn bị trang
        run: |
          mkdir -p _site
          cp index.html report.html pdf.html robots.txt .nojekyll _site/
          cp -r fonts assets _site/
      - name: Tạo PDF từ Google Sheet
        run: node tools/make-pdf.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
