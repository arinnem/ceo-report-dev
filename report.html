<style>

body { margin:0; font-family:"SVN-Gilroy", Arial, "Helvetica Neue", Helvetica, sans-serif; color:var(--ink); background:#ebe6da; font-size:8.6pt; line-height:1.38; }

h1 { font-size:19pt; font-weight:700; letter-spacing:-.01em; margin:3px 0 0; line-height:1.15; }

.det td { padding:6px 7px; vertical-align:top; border-bottom:1px solid var(--line); border-left:1px solid var(--line); font-size:7.9pt; background:var(--cream2); }

.det tbody.proj > tr:last-child > td { border-bottom:1px solid #d9c58f; }
.det td.pc, .det td.vx { background:var(--cream); }
.pname { font-size:10.5pt; font-weight:600; line-height:1.2; margin:0 0 6px; text-transform:uppercase; }

.pms { color:var(--ink2); } .pms .ml { display:block; }

.cont { color:var(--ink3); font-style:italic; font-size:7.3pt; text-transform:none; font-weight:400; }
.tname { font-weight:600; font-size:8.6pt; } .tgoal { color:var(--ink2); margin-top:2px; }
.tc { text-align:center; } .tc .pct { font-size:12.5pt; display:block; color:var(--gold); } .tc .lbl { display:block; font-size:7pt; color:var(--ink2); }
.tc .dash { display:block; font-size:12.5pt; }

.kq .main, .kh .main { font-weight:600; font-size:8.6pt; }
.kq p, .kh p { margin:1px 0; } .kq p:not(.main):not(.pos) { color:var(--ink2); } .kq .pos { color:var(--green); }
.kh .meta { color:var(--ink2); font-size:7.5pt; margin-top:2px; }
.na { color:#b5ab95; margin:0; }
.more { color:var(--ink3); font-style:italic; font-size:7.1pt; margin-top:2px; }
.vx h4 { margin:0 0 3px; font-size:8.8pt; font-weight:600; color:var(--gold); } .vx h4.x { margin-top:8px; }
.vx ul { margin:0; padding-left:0; list-style:none; } .vx li { margin-bottom:3px; } .vx ul.x li { font-weight:600; }
.vx li.auto { font-weight:400 !important; color:var(--ink2); font-size:7.2pt; }
.auto-tag { display:inline-block; font-size:6.2pt; font-weight:600; color:var(--goldd); border:1px solid #dcc78e; border-radius:3px; padding:0 3px; margin-right:3px; vertical-align:1px; }
.fnote { font-size:7.2pt; color:var(--ink2); margin-top:8px; }

#measure { position:absolute; left:-9999px; top:0; visibility:hidden; }

@media print {
  body { background:#fff; }
  .bar, .drop, .warnbox { display:none !important; }
  #pages { padding:0; }
  .page { margin:0; box-shadow:none; break-after:page; }
  .page.land { page:land; } .page:last-child { break-after:auto; }
}
@page { size:A4 portrait; margin:0; }
@page land { size:A4 landscape; margin:0; }

/* web wrapper */
.btn.pri{text-decoration:none}
.bar .back{color:var(--gold);font-weight:600;font-size:10pt;white-space:nowrap}
.loading{padding:80px 20px;text-align:center;color:var(--ink2);font-size:11pt}
@media screen and (max-width:1180px){ #pages{padding:10px 0 40px} }
@media print{ .loading{display:none!important} }
</style>

<script>
"use strict";
/* ============================== defaults ============================== */
const DEF = {
  groups: [

    {ma:"02", ten:"Kinh doanh & Hệ sinh thái Số", ngan:"Kinh doanh & HST số", uutien:2, dactinh:"Đo bằng chỉ tiêu kinh doanh / người dùng", tukhoa:"Sun Signature; Visit Vietnam"},
    {ma:"03", ten:"Tài chính & Huy động vốn", ngan:"Tài chính & Vốn", uutien:2, dactinh:"Phụ thuộc cấp phép · lộ trình thị trường vốn", tukhoa:"VNDA; Tài sản mã hóa; TSMH; IPO; giá DVHK; chính sách giá"},
    {ma:"04", ten:"Nền tảng Quản trị & Pháp lý", ngan:"Quản trị & Pháp lý", uutien:3, dactinh:"Chuyển đổi hệ thống quản trị nội bộ", tukhoa:"SCP; HRP; đánh giá hiệu quả; PTDA; pháp lý"},
    {ma:"05", ten:"Đào tạo – Học viện", ngan:"Học viện", uutien:3, dactinh:"Đưa cơ sở đào tạo vào vận hành", tukhoa:"Học viện"}],
  status: {"chua bat dau":"none","dang thuc hien":"run","co vuong mac":"run","tam dung":"warn","da hoan thanh":"done","hoan thanh":"done"},
  params: {near:30, window:60, minPct:80, nearTask:7, windowTask:14, groupNone:50, clip:true, pctMode:"da", packGroups:true, detailAlerts:"sum"},
  info: {donvi:"Văn phòng Ban Điều hành", tieude:"Báo cáo Tổng thể Danh mục Dự án Trọng điểm", trinh:"Tổng Giám đốc", chantrang:"Tập đoàn Sun Group · Báo cáo Tổng thể Danh mục Dự án Trọng điểm trình Tổng Giám đốc", ghichu:""},
  qc: {ma:[1,10,"Mã DA"], ten:[2,80,"Tên dự án"], gd:[1,40,"Giai đoạn"], mota:[3,160,"Mô tả dự án"], moc:[6,300,"Mốc chính"], gdda:[1,40,"Giám đốc dự án"], vm:[3,200,"Vướng mắc"], dx:[3,200,"Đề xuất"],
       dv:[2,60,"Đầu việc"], mtdv:[2,80,"Mục tiêu đầu việc"], nhan:[1,20,"Nhãn %"], kq:[3,160,"Kết quả"], kh:[2,120,"KH tuần tới"], pt:[1,30,"Phụ trách"]},
  rules: {
    QUA_HAN:{name:"Quá hạn", on:true, lv:3, top:true, t:"{moc}: quá hạn {ngay} ({so_ngay} ngày).", p:"Báo cáo nguyên nhân, đề xuất hạn mới và biện pháp khắc phục."},
    SAT_HAN:{name:"Sát hạn", on:true, lv:2, top:true, t:"{moc} còn {so_ngay} ngày ({ngay}).", p:"Rà soát đường găng, xác nhận khả năng đạt mốc trước {ngay}."},
    PCT_THAP:{name:"% thấp so với hạn", on:true, lv:2, top:true, t:"{moc}: còn {so_ngay} ngày đến hạn nhưng mới đạt {pct}.", p:"Chốt phạm vi chắc chắn hoàn thành trước hạn; bổ sung nguồn lực."},
    TAM_DUNG:{name:"Tạm dừng", on:true, lv:2, top:true, t:"Trạng thái “{trang_thai}”.", p:"Làm rõ nguyên nhân và điều kiện để tiếp tục."},
    VUONG_MAC_TRONG:{name:"Vướng mắc chưa mô tả", on:true, lv:1, top:false, t:"Trạng thái “Có vướng mắc” nhưng chưa mô tả vướng mắc.", p:"Bổ sung nội dung vướng mắc và hỗ trợ cần."},
    THIEU_DU_LIEU:{name:"Thiếu dữ liệu", on:true, lv:1, top:false, t:"Chưa cập nhật: {thieu}.", p:"Yêu cầu Ban Dự án cập nhật đầy đủ trong kỳ tới."},
    NHOM_CHUA_CAP_NHAT:{name:"Nhóm chưa cập nhật", on:true, lv:2, top:true, t:"Nhóm {nhom}: {so_chua}/{tong} dự án chưa cập nhật.", p:""}},
  notes: {max:5, minLv:2, auto:true, manual:[]},
  cards: {TONG_DA:{on:false, o:1, t:"Danh mục trọng điểm"}, CO_TRANG_THAI:{on:false, o:2, t:"Có báo cáo trạng thái"},
          CO_PCT:{on:false, o:3, t:"Có tỷ lệ hoàn thành định lượng"}, MOC_SAT_HAN:{on:false, o:4, t:"Mốc đến hạn trong {sat_han} ngày"},
          CAN_CHU_Y:{on:false, o:5, t:"Dự án cần chú ý"}},
};
const DEFAULT_LOGO = "assets/sungroup.png";
const HEALTH = [["done","Hoàn thành","#2e7d4f"],["ok","Đúng tiến độ","#3c6ea6"],["warn","Cảnh báo","#e0a100"],["over","Quá hạn","#b3261e"],["none","Chưa cập nhật","#d9d1bf"]];
const HNAME = Object.fromEntries(HEALTH.map(h => [h[0], h[1]]));

/* ============================== helpers ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/\s+/g," ").trim();
const blank = v => v === null || v === undefined || String(v).trim() === "";
const yes = v => !["khong","no","0","false","tat"].includes(norm(v));
const lvOf = v => { const n = norm(v); return n.startsWith("cao") ? 3 : n.startsWith("thap") ? 1 : 2; };
const DAY = 864e5;
const mkDate = (y,m,d) => { if (y < 1990 || y > 2100) return null; const t = Date.UTC(y,m-1,d), x = new Date(t); return (x.getUTCMonth()===m-1 && x.getUTCDate()===d) ? t : null; };
const fmtD = t => { const x = new Date(t); return String(x.getUTCDate()).padStart(2,"0")+"/"+String(x.getUTCMonth()+1).padStart(2,"0")+"/"+x.getUTCFullYear(); };
const fmtDM = t => fmtD(t).slice(0,5);
const fmtN = (n, d=0) => Number(n).toLocaleString("vi-VN", {maximumFractionDigits:d});
const todayUTC = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); };
const fill = (tpl, v) => String(tpl || "").replace(/\{(\w+)\}/g, (m, k) => v[k] ?? "");
const short = n => { let s = String(n).split(/\s[–-]\s/)[0].trim(); return s.length > 24 ? s.slice(0, 22) + "…" : s; };

function toDate(v){
  if (blank(v)) return null;
  if (typeof v === "number" && v > 20000 && v < 80000) return Date.UTC(1899,11,30) + Math.round(v)*DAY;
  const m = String(v).match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})/);
  return m ? mkDate(+m[3], +m[2], +m[1]) : null;
}
function toPct(v){
  if (blank(v)) return null;
  let n = typeof v === "number" ? v : parseFloat(String(v).replace(",", ".").replace("%",""));
  if (isNaN(n)) return null;
  if (typeof v === "number" ? n <= 1 : (!String(v).includes("%") && n <= 1)) n *= 100;
  return Math.max(0, Math.min(100, n));
}
function lines(v){
  if (blank(v)) return [];
  return String(v).split(/\r?\n/).map(s => s.replace(/\t/g," ").trim()).filter(Boolean);
}
const debullet = s => s.replace(/^[-–•·*•]+\s*/, "").trim();
/* apply input standard → {L (lines), cut (# lines hidden), over} */
function fit(v, q, clip){
  const L = lines(v), total = L.join("").length;
  const over = !!q && (L.length > q[0] || total > q[1]);
  if (!over || !clip) return {L, over, cut:0};
  const out = []; let used = 0, full = 0;
  for (const s of L){
    if (out.length >= q[0] || used >= q[1]) break;
    const room = q[1] - used;
    if (s.length <= room){ out.push(s); used += s.length; full++; }
    else { const t = s.slice(0, room).replace(/\s+\S*$/, ""); if (t.length > 15) out.push(t + "…"); used = q[1]; }
  }
  return {L: out, over, cut: L.length - full};
}
function milestones(text, bad){
  const out = [];

function grid(ws){  // absolute rows/cols, merged cells filled with the top-left value

  if (!ws || !ws["!ref"]) return [];
  const R = XLSX.utils.decode_range(ws["!ref"]), rows = [];
  for (let r = 0; r <= R.e.r; r++){ const row = []; for (let c = 0; c <= R.e.c; c++){ const x = ws[XLSX.utils.encode_cell({r, c})]; row.push(x ? (x.v ?? null) : null); } rows.push(row); }
  const top = new Set();
  for (const mg of ws["!merges"] || []){
    const v = rows[mg.s.r]?.[mg.s.c] ?? null; top.add(mg.s.r + ":" + mg.s.c);
    for (let r = mg.s.r; r <= mg.e.r; r++) for (let c = mg.s.c; c <= mg.e.c; c++) if (rows[r]) rows[r][c] = v;

}

function assignGroups(projects, cfg, warns){

  const other = {ma:"99", ten:"Dự án khác", ngan:"Khác", uutien:99, dactinh:"Chưa xác định nhóm – chọn cột Nhóm hoặc bổ sung từ khóa trong sheet Danh mục", kws:[], items:[], other:true};
  for (const p of projects){
    let g = null;

      g = G.find(x => norm(x.ten) === n || norm(x.ngan) === n || x.ma === String(p.nhom).trim().padStart(2,"0"));
      if (!g) warns.push(`Dòng ${p.row} (${p.ten}): nhóm “${p.nhom}” không có trong Danh mục – đã gán theo từ khóa.`); }

    add("QUA_HAN", V({moc:"Dự án", ngay:fmtD(p.finalDue), so_ngay:-days(p.finalDue)}), {d:days(p.finalDue), s:`Dự án (${fmtDM(p.finalDue)})`});

    add("SAT_HAN", V({moc:`Mốc “${p.next.label}”`, ngay:fmtD(p.next.t), so_ngay:days(p.next.t)}), {d:days(p.next.t), s:`${short(p.next.label)} (${fmtDM(p.next.t)})`});

    else if (days(t.due) <= P.nearTask) add("SAT_HAN", V({moc:nm, ngay:fmtD(t.due), so_ngay:days(t.due)}), {d:days(t.due), task:k, s:`${sn_} (${fmtDM(t.due)})`});
    if (t.due >= cut && days(t.due) <= P.windowTask && t.pct !== null && t.pct < P.minPct) add("PCT_THAP", V({moc:nm, ngay:fmtD(t.due), so_ngay:days(t.due), pct:fmtN(t.pct,1)+"%"}), {d:days(t.due), task:k, s:`${sn_} ${fmtN(t.pct,1)}%`}); });

  if (n && noPlan === n) miss.push("KH tuần tới"); else if (noPlan) miss.push(`KH tuần tới (${noPlan}/${n} đầu việc)`);
  if (miss.length) add("THIEU_DU_LIEU", V({thieu:miss.join(", ")}));
  p.alerts = A.sort((a,b) => b.lv - a.lv || a.d - b.d);
  A.forEach(a => { if (a.task !== null) p.tasks[a.task].alerts.push(a); });

  const updated = !blank(p.tt) || p.tasks.some(t => !blank(t.kq));

    : (A.some(a => ["SAT_HAN","PCT_THAP","TAM_DUNG"].includes(a.code)) || sn === "co vuong mac") ? "warn"

  for (const k of ["ma","ten","gd","gdda"]) if (fit(p[k], Q[k], false).over) overWarn(warns, p.row, p.ten, Q[k], p[k], false);
  for (const t of p.tasks){ t.fit = {};
    for (const k of ["dv","mtdv","kq","kh"]){ t.fit[k] = fit(t[k], Q[k], P.clip); if (t.fit[k].over) overWarn(warns, t.row, p.ten, Q[k], t[k], P.clip); }
    for (const k of ["nhan","pt"]) if (fit(t[k], Q[k], false).over) overWarn(warns, t.row, p.ten, Q[k], t[k], false); }
}

const pill = h => `<span class="hp h-${h}">${HNAME[h]}</span>`;

function pieSvg(counts, total){
  const R = 54, cx = 59, cy = 59; let a0 = -Math.PI/2, s = `<svg viewBox="0 0 118 118" role="img" aria-label="Sức khỏe tiến độ">`;
  const parts = HEALTH.filter(h => counts[h[0]] > 0);
  if (parts.length === 1) s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${parts[0][2]}"><title>${parts[0][1]}: ${total}</title></circle>`;
  else for (const [k, name, col] of parts){
    const a1 = a0 + counts[k] / total * 2 * Math.PI, large = a1 - a0 > Math.PI ? 1 : 0;
    s += `<path d="M${cx},${cy} L${cx + R*Math.cos(a0)},${cy + R*Math.sin(a0)} A${R},${R} 0 ${large} 1 ${cx + R*Math.cos(a1)},${cy + R*Math.sin(a1)} Z" fill="${col}" stroke="#fff" stroke-width="2" stroke-linejoin="round"><title>${name}: ${counts[k]}</title></path>`;
    a0 = a1; }

}

        if (first){ where[p.anchor] = pageNo(); first = false; }
        from = k;
        if (from < nT){ dbody = newPage("land"); startBlock(g, true); }
      }
      projOnPage = 1;
    }
  }
  dbody.appendChild(frag(`<p class="fnote">${blank(cfg.info.ghichu) ? "" : esc(cfg.info.ghichu) + "<br>"}Nguồn: ${esc(fname)} · sheet “${esc(sheet)}”. Mục gắn nhãn “Tự động” sinh theo luật cảnh báo trong sheet Danh mục (sát hạn ≤ ${P.near} ngày; % thấp khi còn ≤ ${P.window} ngày mà dưới ${fmtN(P.minPct)}%). Mốc thời gian tính tại ngày chốt ${fmtD(cut)}.${P.clip ? " Nội dung vượt quy chuẩn độ dài được cắt bớt." : ""}</p>`));
  if (!fits(dbody)){ const last = dbody.lastElementChild; last.remove(); dbody = newPage("land"); dbody.appendChild(last); }
  // ---------- spread: let detail tables fill the page height (pages ≥ 50% full)
  for (const pg of PAGES){
    if (!pg.classList.contains("land")) continue;
    const b = pg.querySelector(".pbody"), avail = b.clientHeight, top = b.getBoundingClientRect().top, last = b.lastElementChild;
    if (!last) continue;
    const used = last.getBoundingClientRect().bottom - top;
    const tabs = [...b.querySelectorAll("table.det")]; if (!tabs.length) continue;
    const free = avail - used - 2; if (free <= 4 || used / avail < 0.5) continue;
    const hs = tabs.map(t => t.offsetHeight), sum = hs.reduce((a, c) => a + c, 0);
    tabs.forEach((t, i) => { t.style.height = (hs[i] + free * hs[i] / sum) + "px"; });
  }
  // ---------- numbers & footers
  document.querySelectorAll("[data-pg]").forEach(a => a.textContent = "Tr. " + (where[a.dataset.pg] ?? "–"));
  const tot = PAGES.length;
  PAGES.forEach((pg, i) => { pg.querySelector(".ft").textContent = cfg.info.chantrang; pg.querySelector(".pn").textContent = `Trang ${i+1} / ${tot}`; });
  document.title = cfg.info.tieude + " – " + fmtD(cut);
  return {pages: tot, idxPages: nIdx};
}

const QS = new URLSearchParams(location.search);
const SHEET_ID = QS.get('sheet') || '1REPalLHurrRoH2aTNM2TwxVha7dh40X2JJGoopUe9Ro';
const TABS = ['CauHinh','Nhom','DuAn','DauViec','ChiSo','LuuY'];
function parseCSV(t){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);out.push(row);row=[];f=''}else if(c!='\r')f+=c}
 if(f!==''||row.length){row.push(f);out.push(row)}return out}
function objs(rows){const h=(rows[0]||[]).map(s=>s.trim());return rows.slice(1).filter(r=>r.some(x=>x.trim()!=='')).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
async function loadTab(t){
  const url = QS.get('src')==='local' ? `data/${t}.csv` : `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(t)}&_=${Date.now()}`;
  const r = await fetch(url, {cache:'no-store'}); if (!r.ok) throw new Error(`Không đọc được sheet “${t}” (${r.status})`);
  return objs(parseCSV(await r.text()));
}
const numOr = v => { const s = String(v ?? '').trim(); return /^-?\d+([.,]\d+)?$/.test(s) ? +s.replace(',', '.') : v; };
function toWorkbook(T){
  const cfg = Object.fromEntries(T.CauHinh.map(r => [r['Tham số'], r['Giá trị']]));
  const title = cfg['Tiêu đề báo cáo PDF'] || 'Báo cáo Tổng thể Danh mục Dự án Trọng điểm';
  const dm = [];
  dm.push(['Mã','Tên nhóm','Tên ngắn','Ưu tiên','Đặc tính nhóm','Từ khóa tự gán']);
  T.Nhom.forEach(g => dm.push([g['Mã nhóm'], g['Tên nhóm'], g['Tên ngắn'], numOr(g['Ưu tiên']), g['Đặc tính nhóm'], '']));
  dm.push([]);
  dm.push(['Tham số','Giá trị']);
  for (const k of ['Sát hạn dự án (ngày)','Cửa sổ kiểm tra % dự án (ngày)','Ngưỡng % tối thiểu','Sát hạn đầu việc (ngày)','Cửa sổ kiểm tra % đầu việc (ngày)'])
    if (cfg[k]) dm.push([k, numOr(cfg[k])]);
  dm.push([]);
  dm.push(['Trường','Giá trị']);
  dm.push(['Đơn vị lập', cfg['Đơn vị lập'] || 'Văn phòng Ban Điều hành']);
  dm.push(['Tiêu đề', title]);
  dm.push(['Trình', cfg['Trình'] || 'Tổng Giám đốc']);
  dm.push(['Chân trang', cfg['Chân trang'] || 'Tập đoàn Sun Group · ' + title + ' trình ' + (cfg['Trình'] || 'Tổng Giám đốc')]);
  if (cfg['Ghi chú']) dm.push(['Ghi chú cuối báo cáo', '* ' + cfg['Ghi chú']]);
  dm.push([]);
  dm.push(['Thiết lập','Giá trị']);
  if (cfg['Số mục lưu ý tối đa']) dm.push(['Số mục tối đa', numOr(cfg['Số mục lưu ý tối đa'])]);
  dm.push([]);
  dm.push(['Mã thẻ','Tên hiển thị','Hiển thị','Thứ tự']);
  dm.push(['MOC_SAT_HAN','Mốc đến hạn trong {sat_han} ngày','Có', 2]);
  dm.push([]);
  dm.push(['Thứ tự','Nội dung lưu ý','Mức','Hiển thị']);
  T.LuuY.forEach(n => dm.push([numOr(n['Thứ tự']), n['Nội dung'], n['Mức'], n['Hiển thị']]));
  const ct = [['Kỳ báo cáo', cfg['Kỳ báo cáo'] || '', 'Ngày chốt', cfg['Ngày chốt'] || ''], []];
  ct.push(['Mã DA','Tên dự án','Nhóm','Giai đoạn','Mô tả / mục tiêu dự án','Mốc chính','Hạn hoàn thành DA','% hoàn thành DA','Trạng thái','Giám đốc dự án','Vướng mắc / Hỗ trợ cần','Đề xuất','STT','Đầu việc','Mục tiêu đầu việc','% đầu việc','Nhãn %','Kết quả đến hiện tại','Kế hoạch tuần tới','Hạn đầu việc','Phụ trách đầu việc']);
  const tasks = {}; T.DauViec.forEach(t => (tasks[t['Mã DA']] ??= []).push(t));
  for (const p of T.DuAn){
    const P = [p['Mã DA'], p['Tên dự án'], p['Mã nhóm'], p['Giai đoạn'], p['Mô tả / mục tiêu'], p['Mốc chính'], p['Hạn hoàn thành'], p['% hoàn thành'], p['Trạng thái'], p['Giám đốc dự án'], p['Vướng mắc / hỗ trợ cần'], p['Đề xuất']];
    const ts = (tasks[p['Mã DA']] || []).sort((a,b) => (+a['STT']||0) - (+b['STT']||0));
    if (!ts.length) ct.push([...P, '', '', '', '', '', '', '', '', '']);
    ts.forEach(t => ct.push([...P, numOr(t['STT']), t['Đầu việc'], t['Mục tiêu'], t['% hoàn thành'], t['Nhãn %'], t['Kết quả đến hiện tại'], t['Kế hoạch tuần tới'], t['Hạn'], t['Phụ trách']]));
  }
  const cs = [['Tên chỉ số','Giá trị','Đơn vị','Ghi chú','Mức','Hiển thị','Thứ tự']];
  T.ChiSo.forEach(k => cs.push([k['Tên chỉ số'], numOr(k['Giá trị']), k['Đơn vị'], k['Ghi chú'], k['Mức'], k['Hiển thị'], numOr(k['Thứ tự'])]));
  return {SheetNames:['Chi tiết DA','Danh mục','Chỉ số'], Sheets:{'Chi tiết DA':{aoa:ct}, 'Danh mục':{aoa:dm}, 'Chỉ số':{aoa:cs}}};
}
function fitScreen(){
  if (matchMedia('print').matches) return;
  const w = document.documentElement.clientWidth, pw = 297 * 96 / 25.4 + 24;
  document.getElementById('pages').style.zoom = w < pw ? (w / pw).toFixed(3) : '';
}
async function main(){
  const warns = [];
  try {
    const T = {}; await Promise.all(TABS.map(async t => T[t] = await loadTab(t)));
    await Promise.all([400,500,600,700].map(w => document.fonts.load(`${w} 10pt "SVN-Gilroy"`))).catch(err => warns.push('Font: ' + err.message));
    await document.fonts.ready;
    const wb = toWorkbook(T);
    const cfg = parseConfig(wb, warns);
    const m = parseMain(wb, warns);
    const cut = m.chot ?? todayUTC();
    m.projects.forEach(p => analyse(p, cfg, cut, warns));
    const groups = assignGroups(m.projects, cfg, warns);
    document.body.classList.add('has-report');
    const res = render({cfg, groups, kpis: parseKpis(wb), cut, ky: m.ky, fname: 'Google Sheet “BC Dự án Trọng điểm”', sheet: 'DuAn / DauViec', warns});
    document.getElementById('loading').remove();
    $('#fname').textContent = `${m.projects.length} dự án · ${res.pages} trang · ngày chốt ${fmtD(cut)}`;
    window.__result = {...res, warns};
    fitScreen();
  } catch(e){
    console.warn(e);
    document.getElementById('loading').textContent = 'Chưa tải được dữ liệu: ' + e.message;
  }
}
addEventListener('resize', fitScreen);
addEventListener('beforeprint', () => { document.getElementById('pages').style.zoom = ''; });
addEventListener('afterprint', fitScreen);
main();
